Bây giờ, hãy bắt đầu ngay BƯỚC 1 bằng cách gửi lời chào ngắn gọn và đặt câu hỏi Bước 1 cho tôi!`;

    function copyMegaPrompt() {
      const btn = document.getElementById('btn-copy');
      const label = document.getElementById('btn-label');
      const toast = document.getElementById('toast');

      navigator.clipboard.writeText(MEGA_PROMPT).then(() => {
        btn.classList.add('copied');
        label.textContent = "✓ ĐÃ COPY PROMPT THÀNH CÔNG!";
        
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2500);

        setTimeout(() => {
          btn.classList.remove('copied');
          label.textContent = "COPY MEGA PROMPT MISS VIDEO ADS";
        }, 3000);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = MEGA_PROMPT;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);

        btn.classList.add('copied');
        label.textContent = "✓ ĐÃ COPY PROMPT THÀNH CÔNG!";
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2500);
        setTimeout(() => {
          btn.classList.remove('copied');
          label.textContent = "COPY MEGA PROMPT MISS VIDEO ADS";
        }, 3000);
      });
    }
  </script>
