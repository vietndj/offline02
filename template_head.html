<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bài Tập Thực Hành Tại Lớp • Quay Video Có Người Xem & Kết Nối (Chuẩn Tầng 2.5) | Bài Tập Thực Hành Tại Lớp</title>
  
  <!-- Font Definitions & System Fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
  
  <style>
    /* ═══ 1. FONT DECLARATIONS (Local Repo, System & R2 Fallbacks) ═══ */
    @font-face {
      font-family: 'FD Aeonik Extended';
      src: url('./fonts/FDAeonikExtended-Bold.woff2') format('woff2'),
           url('../fonts/FDAeonikExtended-Bold.woff2') format('woff2'),
           url('./fonts/FDAeonikExtended-Bold.ttf') format('truetype'),
           url('/Users/vietmac/Library/Fonts/FDAeonikExtended-Bold.otf') format('opentype'),
           local('FD Aeonik Extended Bold');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik';
      src: url('./fonts/FDAeonikRegular.ttf') format('truetype'),
           url('./assets/fonts/FDAeonikRegular.ttf') format('truetype'),
           url('/Users/vietmac/Library/Fonts/FDAeonikRegular.ttf') format('truetype'),
           local('FD Aeonik Regular'), local('FDAeonikRegular');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik';
      src: url('./fonts/FDAeonikExtended-SemiBold.ttf') format('truetype'),
           url('/Users/vietmac/Library/Fonts/FDAeonikExtended-SemiBold.otf') format('opentype'),
           local('FD Aeonik SemiBold');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik';
      src: url('./fonts/FDAeonikBold.ttf') format('truetype'),
           url('/Users/vietmac/Library/Fonts/FDAeonikBold.ttf') format('truetype'),
           local('FD Aeonik Bold'), local('FDAeonikBold');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text';
      src: url('./fonts/FDTiemposText-Regular.otf') format('opentype'),
           url('/Users/vietmac/Library/Fonts/FDTiemposText-Regular.otf') format('opentype'),
           local('Tiempos Text Regular'), local('FDTiemposText-Regular');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text';
      src: url('./fonts/FDTiemposText-Medium.otf') format('opentype'),
           url('/Users/vietmac/Library/Fonts/FDTiemposText-Medium.otf') format('opentype'),
           local('Tiempos Text Medium'), local('FDTiemposText-Medium');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text';
      src: url('./fonts/FDTiemposText-RegularItalic.otf') format('opentype'),
           url('/Users/vietmac/Library/Fonts/FDTiemposText-RegularItalic.otf') format('opentype'),
           local('Tiempos Text Regular Italic'), local('FDTiemposText-RegularItalic');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: 'SVN-Integral';
      src: url('./fonts/SVN-IntegralCF-Regular.ttf') format('truetype'),
           url('./assets/fonts/SVN-IntegralCF-Regular.ttf') format('truetype'),
           local('SVN-Integral CF Regular');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ═══ 2. DESIGN TOKENS (30ngayviral Light Theme) ═══ */
    :root {
      --cl-bg:          #ffffff;
      --cl-tint:        #f8fafc;
      --cl-card:        #ffffff;
      --cl-card-muted:  #f1f5f9;
      --cl-accent:      #1a73e8;
      --cl-accent-tint: rgba(26, 115, 232, 0.08);
      --cl-accent-text: #ffffff;
      --cl-line:        rgba(0, 0, 0, 0.07);
      --cl-line-strong: rgba(0, 0, 0, 0.14);
      --cl-text-base:   #090d16; /* Slate 950 (Tương phản 18.8:1) */
      --cl-text-body:   #0f172a; /* Slate 900 (Mực in WCAG AAA 16.5:1) */
      --cl-text-muted:  #475569; /* Slate 600 */
      --cl-danger:      #dc2626;
      --cl-danger-bg:   #fef2f2;
      --cl-success:     #16a34a;
      --cl-success-bg:  #f0fdf4;
      --cl-amber:       #d97706;
      --cl-amber-bg:    #fffbeb;
      --cl-purple:      #7c3aed;
      --cl-purple-bg:   #f5f3ff;

      /* Radii */
      --cl-radius-lg:   24px;
      --cl-radius-md:   16px;
      --cl-radius-sm:   10px;
      --cl-radius-full: 9999px;

      /* Typography Stacks */
      --font-display-short: 'FD Aeonik Extended', 'SVN-Integral', 'Inter', -apple-system, sans-serif;
      --font-display-long:  'FD Aeonik', 'Inter', -apple-system, sans-serif;
      --font-body:          'Tiempos Text', 'Inter', Georgia, serif;
      --font-editorial:     'Tiempos Text', 'Playfair Display', Georgia, serif;
      --font-mono:          'JetBrains Mono', monospace;

      /* Apple Motion Physics Curves */
      --apple-spring: cubic-bezier(0.25, 1, 0.35, 1.05);
      --apple-ease:   cubic-bezier(0.16, 1, 0.3, 1);
      --apple-hover:  cubic-bezier(0.2, 0.9, 0.3, 1.08);
    }

    /* ═══ 3. RESET & BASE ═══ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--cl-bg);
      color: var(--cl-text-base);
      font-family: var(--font-body);
    }

    body {
      overflow-x: clip;
      min-height: 100vh;
      line-height: 1.7;
      background-color: var(--cl-bg);
    }

    /* ═══ 4. TOP STICKY NAV BAR ═══ */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--cl-line);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .top-nav__brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-nav__badge {
      background: var(--cl-text-base);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: var(--cl-radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .top-nav__title {
      font-family: var(--font-display-long);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--cl-text-base);
    }
    .top-nav__links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .top-nav__link, .nav-btn {
      font-family: var(--font-display-long);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--cl-text-muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: var(--cl-radius-sm);
      background: var(--cl-tint);
      border: 1px solid var(--cl-line);
      transition: all 0.2s var(--apple-ease);
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }
    .top-nav__link:hover, .nav-btn:hover {
      color: var(--cl-accent);
      border-color: var(--cl-accent);
      background: var(--cl-accent-tint);
    }
    .top-nav__link--hub, .nav-btn--back {
      background: var(--cl-accent);
      color: #ffffff !important;
      border-color: var(--cl-accent);
      font-weight: 700;
    }
    .top-nav__link--hub:hover, .nav-btn--back:hover {
      background: #1557b0;
      color: #ffffff !important;
    }
    .top-nav__link--accent, .nav-btn--accent {
      color: var(--cl-amber) !important;
      border-color: rgba(217, 119, 6, 0.4) !important;
      background: var(--cl-amber-bg) !important;
    }

    /* ═══ 5. VIEWPORT-FRAMED ZEBRA SECTIONS ═══ */
    /* 1 Khối = 1 Màn Hình = 1 Nội Dung (100dvh) */
    .cl-zebra-section {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 90px 24px;
      box-sizing: border-box;
      transition: background-color 0.3s ease;
      scroll-margin-top: 60px;
    }

    .cl-zebra--light {
      background-color: var(--cl-bg);
    }

    .cl-zebra--tint {
      background-color: var(--cl-tint);
      border-top: 1px solid var(--cl-line);
      border-bottom: 1px solid var(--cl-line);
    }

    .cl-sec-container {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .cl-sec-container--wide {
      max-width: 1120px;
    }

    .cl-sec-container--narrow {
      max-width: 740px;
    }

    .cl-sec-container--left {
      align-items: flex-start;
      text-align: left;
    }

    /* ═══ 6. TYPOGRAPHY & HEADINGS ═══ */
    .cl-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cl-accent);
      background: var(--cl-accent-tint);
      border: 1px solid rgba(26, 115, 232, 0.18);
      padding: 6px 16px;
      border-radius: var(--cl-radius-full);
      margin-bottom: 20px;
    }

    .cl-badge--red {
      color: var(--cl-danger);
      background: var(--cl-danger-bg);
      border-color: rgba(220, 38, 38, 0.2);
    }
    .cl-badge--amber {
      color: var(--cl-amber);
      background: var(--cl-amber-bg);
      border-color: rgba(217, 119, 6, 0.2);
    }
    .cl-badge--purple {
      color: var(--cl-purple);
      background: var(--cl-purple-bg);
      border-color: rgba(124, 58, 237, 0.2);
    }
    .cl-badge--green {
      color: var(--cl-success);
      background: var(--cl-success-bg);
      border-color: rgba(22, 163, 74, 0.2);
    }

    /* Tiêu đề ngắn <= 8 từ: BẮT BUỘC 100% IN HOA */
    .title-short {
      font-family: var(--font-display-short);
      font-weight: 700;
      font-size: clamp(26px, 3.8vw, 42px);
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--cl-text-base);
      margin-bottom: 18px;
      text-wrap: balance;
    }

    /* Tiêu đề dài / câu hỏi > 8 từ: FD Aeonik SemiBold */
    .title-long {
      font-family: var(--font-display-long);
      font-weight: 600;
      font-size: clamp(22px, 3.2vw, 36px);
      line-height: 1.35;
      letter-spacing: -0.015em;
      color: var(--cl-text-base);
      margin-bottom: 20px;
      text-wrap: balance;
    }

    .editorial-hook {
      font-family: var(--font-editorial);
      font-style: italic;
      font-size: clamp(17px, 2.2vw, 21px);
      line-height: 1.6;
      color: var(--cl-accent);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .cl-body {
      font-size: clamp(15.5px, 1.6vw, 17.5px);
      color: var(--cl-text-body);
      line-height: 1.8;
      margin-bottom: 28px;
      max-width: 740px;
    }

    /* ═══ 7. SPECIAL PEDAGOGY MODULES ═══ */
    /* Exercise Prompt Card (Khối Đề Bài 100dvh) */
    .exercise-hero-card {
      background: #ffffff;
      border: 1px solid var(--cl-line);
      border-radius: var(--cl-radius-lg);
      padding: 36px 40px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
      text-align: left;
      margin-bottom: 24px;
      border-left: 6px solid var(--cl-accent);
    }
    .exercise-meta-pills {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .exercise-meta-pill {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: var(--cl-radius-sm);
      background: var(--cl-tint);
      border: 1px solid var(--cl-line);
      color: var(--cl-text-muted);
    }
    .exercise-prompt-quote {
      font-family: var(--font-display-long);
      font-size: clamp(20px, 2.8vw, 27px);
      font-weight: 700;
      line-height: 1.45;
      color: var(--cl-text-base);
      margin-bottom: 16px;
    }
    .exercise-prompt-sub {
      font-size: 15px;
      color: var(--cl-text-muted);
      line-height: 1.65;
    }

    /* ═══ Open Thinking Box (Tự Vấn 2 Phút Trước Khi Xem Lời Giải) ═══ */
    .thinking-open-card,
    .reflection-box {
      background: #ffffff;
      border: 1px solid var(--cl-line);
      border-top: 4px solid var(--cl-accent);
      border-radius: var(--cl-radius-lg);
      padding: 26px 30px;
      width: 100%;
      text-align: left;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.04);
      margin-top: 6px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .thinking-open-header,
    .reflection-box-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--cl-line);
      text-align: left;
    }

    .thinking-open-title,
    .reflection-title-main {
      font-family: var(--font-display-short);
      font-size: 15px;
      font-weight: 700;
      color: var(--cl-accent);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .thinking-sub-badge,
    .reflection-subtitle {
      font-family: var(--font-display-long);
      font-size: 12px;
      font-weight: 600;
      color: var(--cl-text-muted);
      background: var(--cl-tint);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--cl-line);
      white-space: nowrap;
    }

    .thinking-prompts-list,
    .reflection-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      text-align: left;
    }

    .thinking-prompt-item,
    .reflection-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid rgba(226, 232, 240, 0.9);
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--cl-text-body);
      line-height: 1.6;
      text-align: left;
      transition: all 0.2s ease;
    }

    .thinking-prompt-item:hover,
    .reflection-item:hover {
      background: #f1f5f9;
      border-color: rgba(26, 115, 232, 0.35);
      transform: translateX(3px);
    }

    .thinking-prompt-bullet,
    .reflection-item-num {
      width: 26px;
      height: 26px;
      min-width: 26px;
      border-radius: 7px;
      background: #eff6ff;
      color: var(--cl-accent);
      font-weight: 800;
      font-family: var(--font-mono);
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(26, 115, 232, 0.25);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .thinking-prompt-text,
    .reflection-item-text {
      flex: 1;
      text-align: left;
      text-wrap: pretty;
    }

    /* Comparison Subcards for Steps 1, 2, 3 */
    .step-comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      text-align: left;
      margin-top: 14px;
    }
    @media (max-width: 800px) {
      .step-comparison-grid {
        grid-template-columns: 1fr;
      }
    }
    .step-card {
      background: #ffffff;
      border: 1px solid var(--cl-line);
      border-radius: var(--cl-radius-lg);
      padding: 28px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .step-card__label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .step-card__quote {
      font-family: var(--font-editorial);
      font-style: italic;
      font-size: 17px;
      line-height: 1.6;
      color: var(--cl-text-base);
      font-weight: 500;
      padding: 16px;
      background: var(--cl-tint);
      border-radius: var(--cl-radius-sm);
      border-left: 3px solid var(--cl-accent);
      margin-bottom: 14px;
    }
    .step-card__desc {
      font-size: 15px;
      color: var(--cl-text-body);
      line-height: 1.7;
    }

    /* Step 4: 3-Cards Adult Friction Triad */
    .friction-triad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      text-align: left;
      margin-top: 16px;
    }
    @media (max-width: 900px) {
      .friction-triad-grid {
        grid-template-columns: 1fr;
      }
    }
    .friction-card {
      background: #ffffff;
      border: 1px solid rgba(124, 58, 237, 0.2);
      border-radius: var(--cl-radius-lg);
      padding: 26px 22px;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.04);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .friction-card__badge {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 800;
      color: var(--cl-purple);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .friction-card__title {
      font-family: var(--font-display-long);
      font-size: 17px;
      font-weight: 700;
      color: var(--cl-text-base);
    }
    .friction-card__quote {
      font-family: var(--font-editorial);
      font-style: italic;
      font-size: 14.5px;
      color: var(--cl-text-body);
      line-height: 1.55;
      background: var(--cl-purple-bg);
      padding: 12px 14px;
      border-radius: var(--cl-radius-sm);
      border-left: 3px solid var(--cl-purple);
    }
    .friction-card__why {
      font-size: 13.5px;
      color: var(--cl-text-muted);
      line-height: 1.55;
      margin-top: auto;
    }

    /* Conclusion Box (Phương Án 2.5) */
    .conclusion-hero-card {
      background: linear-gradient(135deg, #f5f3ff 0%, #eff6ff 100%);
      border: 1px solid rgba(124, 58, 237, 0.25);
      border-radius: var(--cl-radius-lg);
      padding: 28px 32px;
      width: 100%;
      text-align: left;
      margin-top: 24px;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.05);
    }
    .conclusion-hero-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--cl-purple);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .conclusion-hero-text {
      font-size: 16px;
      color: var(--cl-text-body);
      line-height: 1.75;
    }
    .conclusion-hero-text strong {
      color: var(--cl-text-base);
    }

    /* Final Approved Script List */
    .final-script-card {
      background: #ffffff;
      border: 1px solid var(--cl-line);
      border-radius: var(--cl-radius-lg);
      padding: 32px 36px;
      width: 100%;
      text-align: left;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      margin-top: 16px;
    }
    .script-item-row {
      display: flex;
      align-items: baseline;
      gap: 18px;
      padding: 16px 0;
      border-bottom: 1px solid var(--cl-line);
    }
    .script-item-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .script-item-row:first-child {
      padding-top: 0;
    }
    @media (max-width: 768px) {
      .script-item-row {
        flex-direction: column;
        gap: 8px;
      }
    }
    .script-badge-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 6px;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
